name: Windows RDP via Cloudflare

on:
  workflow_dispatch:

jobs:
  launch-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: تفعيل سطح المكتب البعيد وإعداد بيانات الدخول
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $SecurePassword = ConvertTo-SecureString "RdpPass@2026!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $SecurePassword

      - name: تحميل وتثبيت أداة Cloudflared
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: فتح نفق الاتصال عبر Cloudflare
        run: |
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "access tcp --url localhost:3389 --hostname rdp.trycloudflare.com" -WindowStyle Hidden
          # ملاحظة: Cloudflare تتيح الاتصال المباشر عبر TCP للأنفاق المحلية، وسنقوم بطباعة بيانات الاتصال
          Write-Host "========================================="
          Write-Host "تم إطلاق النفق بنجاح عبر Cloudflare!"
          Write-Host "اسم المستخدم (Username): runneradmin"
          Write-Host "كلمة المرور (Password): RdpPass@2026!"
          Write-Host "========================================="

      - name: إبقاء الخادم نشطاً
        run: |
          while ($true) {
            Start-Sleep -Seconds 300
            Write-Host "الجلسة لا تزال نشطة..."
          }
